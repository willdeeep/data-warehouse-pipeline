[project]
name = "loom-datagen"
version = "0.1.0"
description = "Standalone Faker-based synthetic data generator for the Loom BigQuery warehouse"
requires-python = ">=3.13"
dependencies = [
  "faker>=30",
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=17",
  "google-cloud-bigquery>=3.25",
  "pydantic-settings>=2.5",
  "pyyaml>=6",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
loom-datagen = "loom_datagen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_datagen"]

[tool.pytest.ini_options]
markers = ["integration: requires BigQuery + ADC"]
addopts = "-m 'not integration'"
testpaths = ["tests"]
