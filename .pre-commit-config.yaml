# Dev-branch quality gate (issue #28): local hooks, no CI cost.
# Install once:  uv tool install pre-commit && pre-commit install
minimum_pre_commit_version: "3.5.0"
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # SQL linting (sqlfluff) is added in Plan 03, once the dbt project compiles —
  # its dbt templater needs a working profile + installed deps to lint models.

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.100.2
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args: ["--tf-init-args=-backend=false"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key   # guards against re-committing keyfiles
