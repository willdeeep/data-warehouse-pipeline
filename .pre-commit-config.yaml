# Dev-branch quality gate (issue #28): local hooks, no CI cost.
# Install once:  uv tool install pre-commit && pre-commit install
minimum_pre_commit_version: "3.5.0"
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    # Legacy Airflow DAG code + its root tests carry lint debt (E501/F401); they are
    # excluded from ruff until the Plan 04 rewrite. Tracked by #70 (docstrings), #71/#72
    # (DAG + drift tests). `data_generation/tests` is NOT matched by these anchored patterns.
    hooks:
      - id: ruff
        args: [--fix]
        exclude: '^(pipeline/dags/|tests/)'
      - id: ruff-format
        exclude: '^(pipeline/dags/|tests/)'

  # SQL linting (sqlfluff) is added in Plan 03, once the dbt project compiles —
  # its dbt templater needs a working profile + installed deps to lint models.

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args: ["--tf-init-args=-backend=false"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key   # guards against re-committing keyfiles
