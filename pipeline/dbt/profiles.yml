# dbt connection profiles. Auth is OAuth2 / Application Default Credentials (no keyfiles):
#   gcloud auth application-default login
# Datasets are env-prefixed (#29): dev_* for dev, stg_* for staging, bare for prod.
loom:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('DBT_WAREHOUSE_DATASET', 'dev_warehouse') }}"
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      threads: "{{ env_var('DBT_THREADS', 4) | as_number }}"
      priority: interactive
      job_retries: 1
      job_execution_timeout_seconds: 1800
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('DBT_WAREHOUSE_DATASET', 'warehouse') }}"
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      threads: "{{ env_var('DBT_THREADS', 4) | as_number }}"
      priority: batch
      job_retries: 3
      job_execution_timeout_seconds: 3600
