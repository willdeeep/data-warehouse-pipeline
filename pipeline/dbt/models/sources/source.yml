version: 2

sources:
- name: loom_sync
  # database omitted -> uses the profile's project (GCP_PROJECT_ID); schema env-prefixed per env (#29)
  schema: "{{ env_var('DBT_SOURCE_DATASET', 'loom_sync') }}"
  description: 'Source database containing e-commerce and marketing data from the Loom platform'
  config:
    freshness:  # moved under config (dbt 1.11 deprecation)
      warn_after: {count: 24, period: hour}  # Warn if data is older than 24 hours
      error_after: {count: 48, period: hour} # Error if data is older than 48 hours
  tables:

  - name: adplatform_data
    description: 'Daily advertising platform metrics aggregated across multiple channels'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - date
    columns:
    - name: date
      description: 'Date of advertising activity'
      data_type: DATE
      tests:
        - not_null
        - dbt_utils.accepted_range:
            min_value: "'2020-01-01'"
            max_value: "current_date()"
    - name: criteo_clicks
      description: 'Number of clicks from Criteo advertising campaigns'
      data_type: INTEGER
      tests:
        - dbt_utils.accepted_range:
            min_value: 0
    - name: criteo_cost
      description: 'Total advertising spend on Criteo platform in USD'
      data_type: FLOAT
      tests:
        - dbt_utils.accepted_range:
            min_value: 0
    - name: criteo_impressions
      description: 'Number of ad impressions served through Criteo platform'
      data_type: INTEGER
      tests:
        - dbt_utils.accepted_range:
            min_value: 0
    - name: date
      description: 'Date of advertising activity'
      data_type: DATE
    - name: google_clicks
      description: 'Number of clicks from Google Ads campaigns'
      data_type: INTEGER
      tests:
        - dbt_utils.accepted_range:
            min_value: 0
    - name: google_cost
      description: 'Total advertising spend on Google Ads platform in USD'
      data_type: FLOAT
      tests:
        - dbt_utils.accepted_range:
            min_value: 0
    - name: google_impressions
      description: 'Number of ad impressions served through Google Ads platform'
      data_type: INTEGER
      tests:
        - dbt_utils.accepted_range:
            min_value: 0
    - name: meta_clicks
      description: 'Number of clicks from Meta (Facebook/Instagram) advertising campaigns'
      data_type: INTEGER
    - name: meta_cost
      description: 'Total advertising spend on Meta platforms in USD'
      data_type: FLOAT
    - name: meta_impressions
      description: 'Number of ad impressions served through Meta platforms'
      data_type: INTEGER
    - name: rtbhouse_clicks
      description: 'Number of clicks from RTB House advertising campaigns'
      data_type: INTEGER
    - name: rtbhouse_cost
      description: 'Total advertising spend on RTB House platform in USD'
      data_type: FLOAT
    - name: rtbhouse_impressions
      description: 'Number of ad impressions served through RTB House platform'
      data_type: INTEGER
    - name: tiktok_clicks
      description: 'Number of clicks from TikTok advertising campaigns'
      data_type: INTEGER
    - name: tiktok_cost
      description: 'Total advertising spend on TikTok platform in USD'
      data_type: FLOAT
    - name: tiktok_impressions
      description: 'Number of ad impressions served through TikTok platform'
      data_type: INTEGER

  - name: funnelevents
    description: 'User funnel events tracking customer journey from page views to purchases'
    # Temporarily disabled due to BigQuery syntax issue
    # tests:
    #   - dbt_utils.unique_combination_of_columns:
    #       combination_of_columns:
    #         - session_id
    #         - event_time
    #         - event_name
    #         - item_id
    #       config:
    #         severity: warn
    columns:
    - name: date
      description: 'Date when the event occurred'
      data_type: DATE
      tests:
        - not_null
    - name: device_category
      description: 'Type of device used (desktop, mobile, tablet)'
      data_type: STRING
      tests:
        - accepted_values:
            values: ['desktop', 'mobile', 'tablet', 'unknown']
            config:
              severity: warn
    - name: event_name
      description: 'Name of the tracked event (page_view, add_to_cart, purchase, etc.)'
      data_type: STRING
      tests:
        - not_null
        - accepted_values:
            values: ['page_view', 'add_to_cart', 'purchase', 'begin_checkout', 'view_item', 'remove_from_cart']
            config:
              severity: warn
    - name: event_time
      description: 'Timestamp when the event occurred'
      data_type: DATETIME
      tests:
        - not_null
    - name: item_id
      description: 'Unique identifier for the product associated with the event'
      data_type: STRING
    - name: session_id
      description: 'Unique identifier for the user session'
      data_type: STRING
      tests:
        - not_null
    - name: transaction_id
      description: 'Unique identifier for the transaction (null for non-purchase events)'
      data_type: STRING
    - name: user_cookie_id
      description: 'Anonymous user identifier based on browser cookie'
      data_type: STRING
    - name: user_crm_id
      description: 'Customer relationship management ID for registered users'
      data_type: STRING

  - name: product_costs
    description: 'Cost basis for each product used in margin and profitability calculations'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - item_id
    columns:
    - name: cost_of_item
      description: 'Cost to acquire or manufacture the product in USD'
      data_type: FLOAT
      tests:
        - not_null
        - dbt_utils.accepted_range:
            min_value: 0
    - name: item_id
      description: 'Unique identifier for the product'
      data_type: STRING
      tests:
        - not_null
        - unique

  - name: product_listprices
    description: 'List prices for products before any discounts or promotions'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - item_id
    columns:
    - name: item_id
      description: 'Unique identifier for the product'
      data_type: STRING
      tests:
        - not_null
        - unique
    - name: item_list_price
      description: 'Official list price of the product in USD'
      data_type: FLOAT
      tests:
        - not_null
        - dbt_utils.accepted_range:
            min_value: 0

  - name: product_returns
    description: 'Product return transactions and status tracking'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - transaction_id
            - item_id
          config:
            severity: warn
    columns:
    - name: return_date
      description: 'Date when the return was processed'
      data_type: DATE
      tests:
        - not_null
        - dbt_utils.accepted_range:
            min_value: "'2020-01-01'"
            max_value: "current_date()"
    - name: transaction_id
      description: 'Unique identifier for the original transaction'
      data_type: STRING
      tests:
        - not_null
    - name: item_id
      description: 'Unique identifier for the returned product'
      data_type: STRING
      tests:
        - not_null
    - name: item_quantity
      description: 'Original quantity of items purchased'
      data_type: INTEGER
      tests:
        - dbt_utils.accepted_range:
            min_value: 1
    - name: return_quantity
      description: 'Number of items returned'
      data_type: FLOAT
      tests:
        - dbt_utils.accepted_range:
            min_value: 0
    - name: return_status
      description: 'Status of the return (Refund, Exchange)'
      data_type: STRING
      tests:
        - accepted_values:
            values: ['Refund', 'Exchange']
            config:
              severity: warn

  - name: productattributes
    description: 'Product catalog with attributes and categorization'
    columns:
    - name: item_id
      description: 'Unique identifier for the product'
      data_type: STRING
      tests:
        - not_null
        - unique
    - name: item_brand
      description: 'Brand name of the product'
      data_type: STRING
    - name: item_gender
      description: 'Target gender for the product (male, female, unisex)'
      data_type: STRING
    - name: item_main_category
      description: 'Primary category classification for the product'
      data_type: STRING
    - name: item_name
      description: 'Display name of the product'
      data_type: STRING
    - name: item_sub_category
      description: 'Secondary category classification for the product'
      data_type: STRING

  - name: sessions
    description: 'User session data, granularity is one line per session event, includes traffic source and geographic information'
    columns:
    - name: city
      description: 'City location of the user session'
      data_type: STRING
    - name: date
      description: 'Date when the session occurred'
      data_type: DATE
      tests:
        - not_null
        - dbt_utils.accepted_range:
            min_value: "'2020-01-01'"
            max_value: "current_date()"
    - name: device_category
      description: 'Type of device used (desktop, mobile, tablet)'
      data_type: STRING
      tests:
        - accepted_values:
            values: ['desktop', 'mobile', 'tablet', 'unknown']
            config:
              severity: warn
    - name: session_id
      description: 'Session ID for the user session (each session will be recorded across multiple lines)'
      data_type: STRING
      tests:
        - not_null
    - name: traffic_medium
      description: 'Marketing medium that drove the session (organic, paid, email, etc.)'
      data_type: STRING
      tests:
        - accepted_values:
            values: [
              'organic', 'paid', 'email', 'social', 'direct', 'referral', 
              'cpc', 'display', '(none)','crm', 'affiliate', 'influencer', 
              'cpm', 'organic_social', 'paid_social', 'comparison', 'cpv'
              ]
            config:
              severity: warn
    - name: traffic_source
      description: 'Specific source that drove the session (google, facebook, direct, etc.)'
      data_type: STRING
    - name: user_cookie_id
      description: 'Anonymous user identifier based on browser cookie'
      data_type: STRING
    - name: user_crm_id
      description: 'Customer relationship management ID for registered users'
      data_type: STRING

  - name: transactions
    description: 'E-commerce transaction summary data with revenue and shipping details'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - transaction_id
    columns:
    - name: transaction_id
      description: 'Unique identifier for the transaction'
      data_type: STRING
      tests:
        - not_null
        - unique
    - name: date
      description: 'Date when the transaction occurred'
      data_type: DATE
      tests:
        - not_null
        - dbt_utils.accepted_range:
            min_value: "'2020-01-01'"
            max_value: "current_date()"
    - name: session_id
      description: 'Unique identifier for the session where transaction occurred'
      data_type: STRING
      tests:
        - not_null
    - name: transaction_coupon
      description: 'Coupon code applied to the transaction'
      data_type: STRING
    - name: transaction_revenue
      description: 'Total revenue from the transaction excluding shipping in USD'
      data_type: FLOAT
      tests:
        - dbt_utils.accepted_range:
            min_value: 0
    - name: transaction_shipping
      description: 'Shipping cost charged for the transaction in USD'
      data_type: FLOAT
      tests:
        - dbt_utils.accepted_range:
            min_value: 0
    - name: transaction_total
      description: 'Total amount charged including shipping and taxes in USD'
      data_type: FLOAT
      tests:
        - dbt_utils.accepted_range:
            min_value: 0
    - name: user_cookie_id
      description: 'Anonymous user identifier based on browser cookie'
      data_type: STRING
    - name: user_crm_id
      description: 'Customer relationship management ID for registered users'
      data_type: STRING

  - name: transactionsanditems
    description: 'Transaction line items showing individual products purchased in each transaction'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - transaction_id
            - item_id
          config:
            severity: warn
    columns:
    - name: item_id
      description: 'Unique identifier for the product purchased'
      data_type: STRING
      tests:
        - not_null
    - name: transaction_id
      description: 'Unique identifier for the transaction'
      data_type: STRING
      tests:
        - not_null
    - name: date
      description: 'Date when the transaction occurred'
      data_type: DATE
      tests:
        - not_null
        - dbt_utils.accepted_range:
            min_value: "'2020-01-01'"
            max_value: "current_date()"
    - name: item_price
      description: 'Price paid for the individual item in USD'
      data_type: FLOAT
      tests:
        - dbt_utils.accepted_range:
            min_value: 0
    - name: item_quantity
      description: 'Number of units purchased for this item'
      data_type: INTEGER
      tests:
        - dbt_utils.accepted_range:
            min_value: 1


  - name: users
    description: 'Customer profile and lifecycle data with subscription status'
    columns:
    - name: user_crm_id # - unique - temprorarily disabled to allow for de-duplication of CRM IDs during staging
      description: 'Customer relationship management ID for registered users'
      data_type: STRING
      tests:
        - not_null
        - sql_injection_detection:
            config:
              severity: warn
    - name: city
      description: 'City location of the user'
      data_type: STRING
    - name: first_purchase_date
      description: 'Date of the users first purchase'
      data_type: DATE
    - name: latest_login_date
      description: 'Most recent date the user logged into their account'
      data_type: DATE
    - name: latest_purchase_date
      description: 'Most recent date the user made a purchase'
      data_type: DATE
    - name: opt_in_status
      description: 'Whether the user has opted in to marketing communications'
      data_type: BOOLEAN
    - name: loom_plus_status
      description: 'Is user enrolled in the Loom+ subscription program'
      data_type: BOOLEAN
    - name: loom_plus_tier
      description: 'Loom+ subscription tier level'
      data_type: STRING
    - name: registration_date
      description: 'Date when the user created their account'
      data_type: DATE
    - name: user_gender
      description: 'Self-reported gender of the user'
      data_type: STRING
      tests:
        - accepted_values:
            name: user_gender_valid_values
            values: ['M', 'F', 'Non-binary', 'Unknown']
            config:
              severity: warn
        - sql_injection_detection:
            config:
              severity: warn


- name: ebay
  # eBay landing lives in the env warehouse dataset (dev_warehouse / warehouse) (#29)
  schema: "{{ env_var('DBT_WAREHOUSE_DATASET', 'warehouse') }}"
  description: 'eBay data loaded from external pipeline'
  tables:
    - name: ebay_transformed
      description: 'Transformed eBay data loaded via Python pipeline'
      tests:
        - dbt_utils.unique_combination_of_columns:
            combination_of_columns:
              - id
      columns:
        - name: id
          description: 'Unique identifier for eBay listing'
          data_type: STRING
          tests:
            - not_null
            - unique
        - name: search_term
          description: 'Search term used to find this listing'
          data_type: STRING
        - name: title
          description: 'eBay listing title'
          data_type: STRING
          tests:
            - not_null
        - name: price
          description: 'Listed price of the item'
          data_type: FLOAT
          tests:
            - dbt_utils.accepted_range:
                min_value: 0
        - name: currency
          description: 'Currency of the listed price'
          data_type: STRING
          tests:
            - accepted_values:
                values: ['USD', 'EUR', 'GBP', 'CAD']
                config:
                  severity: warn
        - name: category
          description: 'eBay category classification'
          data_type: STRING
        - name: brand
          description: 'Brand name of the product'
          data_type: STRING
        - name: condition
          description: 'Item condition (new, used, refurbished, etc.)'
          data_type: STRING
          tests:
            - accepted_values:
                values: ['New with tags', 'New with box', 'New without tags']
                config:
                  severity: warn
        - name: gender
          description: 'Target gender for the product (oout of mens, womens, unisex, kids)'
          data_type: STRING
          tests:
            - accepted_values:
                values: ['mens', 'womens', 'unisex', 'kids']
                config:
                  severity: warn
        - name: url
          description: 'eBay listing URL'
          data_type: STRING
          tests:
            - not_null
        - name: transformation_timestamp
          description: 'Timestamp when data was transformed and loaded'
          data_type: TIMESTAMP
          tests:
            - not_null

