[pytest]
# Pytest Configuration for Loom Insights Data Pipeline

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
pythonpath = . pipeline/dags

# Output formatting
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --color=yes
    --durations=10
    --disable-warnings
    -W ignore::pytest.PytestUnknownMarkWarning
    --ignore=pipeline/dbt/dbt_packages
    --ignore=./pipeline/dbt/dbt_packages
    --ignore=**/dbt_packages

# Test markers for categorization
markers =
    unit: Unit tests for individual functions/classes
    integration: Integration tests requiring external dependencies
    dag: DAG-specific tests
    dbt: dbt model and project tests
    performance: Performance and load tests
    benchmark: Benchmark tests for timing comparisons
    slow: Tests that take longer to run
    external: Tests that require external services
    smoke: Quick smoke tests for basic functionality
    requires_db: Tests that require a full Airflow database
    requires_dbt: Tests that require dbt CLI to be available
    requires_bigquery: Tests that require BigQuery credentials
    ci_skip: Tests that should be skipped in CI environments

# Coverage configuration
[coverage:run]
source = pipeline
omit = 
    */tests/*
    */venv/*
    */.venv/*
    */dbt_packages/*
    */__pycache__/*
    */migrations/*
    */node_modules/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

# HTML coverage report settings
[coverage:html]
directory = htmlcov
title = Loom Insights Data Pipeline Coverage Report

# XML coverage report settings  
[coverage:xml]
output = reports/coverage.xml
