name: Astronomer CI - Deploy code

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual triggering

env:
  ## Set API Token as an environment variable
  ASTRO_API_TOKEN: ${{ secrets.ASTRO_API_TOKEN }}

jobs:
  # Quick pre-deployment checks (non-blocking for minor issues)
  pre-deploy-check:
    name: Pre-deployment validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.12'
        
    - name: Quick linting check (non-blocking)
      run: |
        echo "🔍 Running quick code quality check..."
        python -m pip install --upgrade pip
        pip install flake8
        
        # Run basic syntax check - this will fail deployment for syntax errors only
        echo "Checking for syntax errors (blocking)..."
        python -m py_compile dags/*.py tests/*.py || { echo "❌ Syntax errors found - blocking deployment"; exit 1; }
        
        # Run linting but don't fail for style issues
        echo "Running style checks (non-blocking)..."
        flake8 dags/ --count --select=E9,F63,F7,F82 --show-source --statistics || echo "⚠️ Style issues found but not blocking deployment"
        
        echo "✅ Pre-deployment checks complete"

  deploy:
    name: Deploy to Astronomer
    runs-on: ubuntu-latest
    needs: pre-deploy-check
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required by astronomer/deploy-action
      
    - name: Set up Python 3.11.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.12'
        
    - name: Validate deployment setup
      run: |
        DEPLOYMENT_ID="clwkt8n0g041f01oyjp0z63o7"
        if [ -z "$DEPLOYMENT_ID" ]; then
          echo "❌ Deployment ID is not set"
          exit 1
        fi
        
        if [ -z "$ASTRO_API_TOKEN" ]; then
          echo "❌ ASTRO_API_TOKEN secret is not set"
          exit 1
        fi
        
        echo "✅ Deploying to: $DEPLOYMENT_ID"
        echo "✅ Python version: $(python --version)"
        echo "✅ Environment: Production"
      
    - name: Determine deployment type
      id: deploy-type
      run: |
        echo "Determining deployment type based on changed files..."
        
        # Get list of changed files
        git diff --name-only HEAD~1 HEAD > changed_files.txt
        
        # Check if any non-DAG files were changed
        if grep -vE '^dags/.*\.py$' changed_files.txt | grep -E '\.(py|yaml|yml|txt|cfg|toml|ini|Dockerfile)$' > /dev/null; then
          echo "deploy_type=image" >> $GITHUB_OUTPUT
          echo "Full deployment required - infrastructure files changed"
        else
          echo "deploy_type=dags" >> $GITHUB_OUTPUT
          echo "DAG-only deployment - only DAG files changed"
        fi
        
        cat changed_files.txt
        echo "Deployment type: $(cat $GITHUB_OUTPUT | grep deploy_type | cut -d= -f2)"
        
    - name: Deploy to Astro
      uses: astronomer/deploy-action@v0.10.1
      with:
        deployment-id: clwkt8n0g041f01oyjp0z63o7
        parse: true
        force: false  # Prevent accidental force deployments
        deploy-type: ${{ steps.deploy-type.outputs.deploy_type }}
        
    - name: Post-deployment summary
      if: always()
      run: |
        echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "**Deployment ID**: clwkt8n0g041f01oyjp0z63o7" >> $GITHUB_STEP_SUMMARY
        echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "**Timestamp**: $(date -u)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ **Deployment successful!** Your DAGs are now live." >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Deployment failed.** Check the logs above for details." >> $GITHUB_STEP_SUMMARY
        fi
