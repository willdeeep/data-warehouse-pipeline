name: CI

# Required status check for PRs into main (issue #28). Also runs on dev/staging PRs
# and pushes to main for signal. Integration tests (need ADC) are never run here.
on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff@0.14.2 check data_generation      # pinned to match pre-commit
      - run: uvx ruff@0.14.2 format --check data_generation

  datagen-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so uv-dynamic-versioning resolves the version
          fetch-tags: true
      - uses: astral-sh/setup-uv@v5
      - run: cd data_generation && uv sync --extra dev && uv run pytest -q
      - run: cd data_generation && uv run lint-imports

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: validate all environments
        run: |
          for e in dev staging prod; do
            ( cd "infra/terraform/environments/$e" \
              && terraform init -backend=false -input=false \
              && terraform validate )
          done
      - name: fmt check
        run: terraform fmt -check -recursive infra/terraform

  # --- Jobs below activate as their subsystems land; kept visible as the target matrix. ---
  etl-tests:
    if: false # TODO(Plan 04): enable once pipeline/etl/loom_ebay exists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cd pipeline/etl && uv run --with pytest --with requests-mock pytest -q

  dbt-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # dbt CLI ships in dbt-core; pin the runtime to Python 3.12 (dbt lags newer Pythons)
      - run: uv tool install dbt-core --with dbt-bigquery --python 3.12
      - run: dbt deps --project-dir pipeline/dbt
      - run: dbt parse --project-dir pipeline/dbt --profiles-dir pipeline/dbt
        env:
          GCP_PROJECT_ID: dummy # parse is offline; oauth needs no key
          DBT_TARGET: dev

  dag-integrity:
    if: false # TODO(Plan 04): enable once the eBay DAG + deps are in place
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: >
          uv run --with apache-airflow --with apache-airflow-providers-google
          python -c "from airflow.models import DagBag; b=DagBag('pipeline/dags');
          assert not b.import_errors, b.import_errors"
