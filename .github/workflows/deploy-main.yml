name: Deploy (production)

# Automated production deploy on merge to main (issue #28).
# Deploy = `terraform apply` of the prod environment. Auth is keyless via Workload
# Identity Federation — no long-lived service-account key. The pipeline-runtime deploy
# step is deferred to the orchestration spike (Plan 05).
on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # required for WIF OIDC token

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production # gated GitHub Environment; holds the vars below
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA_EMAIL }}

      - uses: hashicorp/setup-terraform@v3

      # prod is a thin env: only its unprefixed datasets + buckets. Config comes from
      # TF_VAR_* (mirrors .env); project-global resources are owned by the bootstrap/dev env.
      - name: Terraform apply (prod)
        working-directory: infra/terraform/environments/prod
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_bq_location: ${{ vars.BQ_LOCATION }}
          TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform plan -input=false -out=tfplan
          # Safety gate: never auto-approve a plan that DESTROYS or REPLACES a resource.
          # A misconfigured TF_VAR (e.g. an unexpanded "${GCP_PROJECT_ID}") forces a
          # name/project change → destroy+recreate; on prod that is data loss. Block it and
          # require a human to inspect + apply manually.
          if terraform show -json tfplan | jq -e '[.resource_changes[].change.actions[]] | index("delete") | not' >/dev/null; then
            terraform apply -input=false tfplan
          else
            echo "::error::Prod plan contains destroy/replace actions — refusing to auto-apply. Inspect the plan and apply manually."
            exit 1
          fi
