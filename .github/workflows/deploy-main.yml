name: Deploy (production)

# Automated production deploy on merge to main (issue #28).
# Deploy = `terraform apply` of the prod environment. Auth is keyless via Workload
# Identity Federation — no long-lived service-account key. The pipeline-runtime deploy
# step is deferred to the orchestration spike (Plan 05).
on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # required for WIF OIDC token

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production # gated GitHub Environment; holds the vars below
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA_EMAIL }}

      - uses: hashicorp/setup-terraform@v3

      - name: Write prod tfvars from environment variables
        working-directory: infra/terraform/environments/prod
        run: |
          cat > terraform.tfvars <<EOF
          project_id           = "${{ vars.GCP_PROJECT_ID }}"
          region               = "${{ vars.GCP_REGION }}"
          bq_location          = "${{ vars.BQ_LOCATION }}"
          state_bucket_name    = "${{ vars.TF_STATE_BUCKET }}"
          dag_logs_bucket      = "${{ vars.DAG_LOGS_BUCKET }}"
          dbt_artifacts_bucket = "${{ vars.DBT_ARTIFACTS_BUCKET }}"
          EOF

      - name: Terraform apply (prod)
        working-directory: infra/terraform/environments/prod
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform apply -auto-approve -input=false
