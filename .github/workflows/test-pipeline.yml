name: Data Pipeline Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.11.12'
  AIRFLOW_VERSION: '2.8.1'
  DOCKER_IMAGE_TAG: astro-ci-test

jobs:
  # Build the Docker image once and use across all test jobs
  build-image:
    name: Build Test Image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image-tag: ${{ env.DOCKER_IMAGE_TAG }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-docker-${{ hashFiles('Dockerfile', 'requirements.txt', 'packages.txt') }}
        restore-keys: |
          ${{ runner.os }}-docker-
          
    - name: Build Docker image
      run: |
        docker build -t ${{ env.DOCKER_IMAGE_TAG }} .
        docker save ${{ env.DOCKER_IMAGE_TAG }} -o /tmp/astro-ci-test.tar
        
    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: /tmp/astro-ci-test.tar
        retention-days: 1
  # Quick smoke tests that run on every push
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build-image
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Docker image
      uses: actions/download-artifact@v4
      with:
        name: docker-image
        path: /tmp
        
    - name: Load Docker image
      run: |
        docker load -i /tmp/astro-ci-test.tar
        
    - name: Run smoke tests
      run: |
        docker run --rm -v "$(pwd):/workspace" ${{ env.DOCKER_IMAGE_TAG }} bash -c "
          cd /workspace && 
          export SKIP_DEPENDENCY_INSTALL=true &&
          export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////tmp/ci_test_airflow.db &&
          export AIRFLOW__CORE__UNIT_TEST_MODE=True &&
          export AIRFLOW__CORE__LOAD_EXAMPLES=False &&
          ./scripts/run_tests.sh --quick
        "

  # Unit tests for core functionality
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-image
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Docker image
      uses: actions/download-artifact@v4
      with:
        name: docker-image
        path: /tmp
        
    - name: Load Docker image
      run: |
        docker load -i /tmp/astro-ci-test.tar
        
    - name: Set up test environment
      run: |
        # Create necessary directories and ensure proper permissions
        mkdir -p $(pwd)/logs $(pwd)/tmp
        chmod 777 $(pwd)/logs $(pwd)/tmp
        # For tests, we use in-memory SQLite (no file-based DB needed)
        echo "Test environment prepared - using in-memory database"
        
    - name: Run unit tests
      run: |
        docker run --rm -v "$(pwd):/workspace" ${{ env.DOCKER_IMAGE_TAG }} bash -c "
          cd /workspace && 
          export SKIP_DEPENDENCY_INSTALL=true &&
          export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////tmp/ci_unit_test_airflow.db &&
          export AIRFLOW__CORE__UNIT_TEST_MODE=True &&
          export AIRFLOW__CORE__LOAD_EXAMPLES=False &&
          ./scripts/run_tests.sh --unit
        "
        
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./reports/coverage.xml
        flags: unittests
        name: codecov-umbrella

  # DAG validation and structure tests
  dag-tests:
    name: DAG Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-image
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Docker image
      uses: actions/download-artifact@v4
      with:
        name: docker-image
        path: /tmp
        
    - name: Load Docker image
      run: |
        docker load -i /tmp/astro-ci-test.tar
        
    - name: Set up test environment for DAG tests
      run: |
        # Create necessary directories and ensure proper permissions
        mkdir -p $(pwd)/logs $(pwd)/tmp
        chmod 777 $(pwd)/logs $(pwd)/tmp
        # For tests, we use in-memory SQLite (no file-based DB needed)
        echo "Test environment prepared - using in-memory database"
        
    - name: Run DAG validation tests
      run: |
        docker run --rm -v "$(pwd):/workspace" ${{ env.DOCKER_IMAGE_TAG }} bash -c "
          cd /workspace && 
          export SKIP_DEPENDENCY_INSTALL=true &&
          export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////tmp/ci_dag_test_airflow.db &&
          export AIRFLOW__CORE__UNIT_TEST_MODE=True &&
          export AIRFLOW__CORE__LOAD_EXAMPLES=False &&
          ./scripts/run_tests.sh --dag
        "
        
    - name: Run DAG validation
      run: |
        docker run --rm -v "$(pwd):/workspace" ${{ env.DOCKER_IMAGE_TAG }} bash -c "
          cd /workspace && 
          export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////tmp/dag_validation.db &&
          export AIRFLOW__CORE__UNIT_TEST_MODE=True &&
          export AIRFLOW__CORE__LOAD_EXAMPLES=False &&
          python scripts/validate_dags.py
        "

  # dbt model tests
  dbt-tests:
    name: dbt Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-image
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Docker image
      uses: actions/download-artifact@v4
      with:
        name: docker-image
        path: /tmp
        
    - name: Load Docker image
      run: |
        docker load -i /tmp/astro-ci-test.tar
        
    - name: Run dbt tests
      run: |
        docker run --rm -v "$(pwd):/workspace" ${{ env.DOCKER_IMAGE_TAG }} bash -c "
          cd /workspace && 
          export SKIP_DEPENDENCY_INSTALL=true &&
          export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////tmp/ci_dbt_test_airflow.db &&
          export AIRFLOW__CORE__UNIT_TEST_MODE=True &&
          export AIRFLOW__CORE__LOAD_EXAMPLES=False &&
          ./scripts/run_tests.sh --dbt
        "
      env:
        # Note: BigQuery credentials would be needed for full dbt tests
        # For CI, we run compilation and parsing tests only
        DBT_PROFILES_DIR: ./dags/dbt

  # Performance tests (run on schedule or manually)
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [build-image, unit-tests, dag-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Docker image
      uses: actions/download-artifact@v4
      with:
        name: docker-image
        path: /tmp
        
    - name: Load Docker image
      run: |
        docker load -i /tmp/astro-ci-test.tar
        
    - name: Run performance tests
      run: |
        docker run --rm -v "$(pwd):/workspace" ${{ env.DOCKER_IMAGE_TAG }} bash -c "
          cd /workspace && 
          export SKIP_DEPENDENCY_INSTALL=true &&
          export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////tmp/ci_perf_test_airflow.db &&
          export AIRFLOW__CORE__UNIT_TEST_MODE=True &&
          export AIRFLOW__CORE__LOAD_EXAMPLES=False &&
          ./scripts/run_tests.sh --performance
        "

  # Code quality checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy
        
    - name: Run linting (non-blocking)
      run: |
        echo "🔍 Running flake8 linting (issues will be documented, not fail the build)..."
        flake8 dags/ tests/ --max-line-length=100 --ignore=E203,W503 --output-file=lint-report.txt || true
        
        # Count issues for summary
        ISSUE_COUNT=$(wc -l < lint-report.txt 2>/dev/null || echo "0")
        
        if [ "$ISSUE_COUNT" -gt 0 ]; then
          echo "⚠️ Found $ISSUE_COUNT linting issues (non-blocking):"
          echo "## 📝 Linting Report" >> $GITHUB_STEP_SUMMARY
          echo "Found **$ISSUE_COUNT** linting issues:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          head -20 lint-report.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          if [ "$ISSUE_COUNT" -gt 20 ]; then
            echo "*... and $((ISSUE_COUNT - 20)) more issues*" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 **Note**: These are style suggestions and won't block deployment." >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ No linting issues found!"
          echo "## ✅ Linting Report" >> $GITHUB_STEP_SUMMARY
          echo "No linting issues found! Code follows style guidelines." >> $GITHUB_STEP_SUMMARY
        fi
        
    - name: Check code formatting (non-blocking)
      run: |
        echo "🎨 Checking code formatting with Black..."
        if black --check dags/ tests/; then
          echo "✅ Code formatting is correct!"
          echo "## ✅ Black Formatting" >> $GITHUB_STEP_SUMMARY
          echo "Code formatting follows Black standards." >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Code formatting issues found (non-blocking)"
          echo "## ⚠️ Black Formatting" >> $GITHUB_STEP_SUMMARY
          echo "Some files would be reformatted by Black, but this won't block the build." >> $GITHUB_STEP_SUMMARY
          echo "Run \`black dags/ tests/\` locally to auto-fix formatting." >> $GITHUB_STEP_SUMMARY
        fi
        
    - name: Check import sorting (non-blocking)
      run: |
        echo "📚 Checking import sorting with isort..."
        if isort --check-only dags/ tests/; then
          echo "✅ Import sorting is correct!"
          echo "## ✅ Import Sorting" >> $GITHUB_STEP_SUMMARY
          echo "Imports are properly sorted." >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Import sorting issues found (non-blocking)"
          echo "## ⚠️ Import Sorting" >> $GITHUB_STEP_SUMMARY
          echo "Some imports could be better sorted, but this won't block the build." >> $GITHUB_STEP_SUMMARY
          echo "Run \`isort dags/ tests/\` locally to auto-fix import sorting." >> $GITHUB_STEP_SUMMARY
        fi

  # Security scanning - non-blocking linting
  security-scan:
    name: Security & Code Quality Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true  # Don't fail the build for linting issues
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run security and linting scan
      uses: github/super-linter@v5
      continue-on-error: true  # Don't fail the step for linting issues
      env:
        DEFAULT_BRANCH: main
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VALIDATE_PYTHON_FLAKE8: true
        VALIDATE_PYTHON_BLACK: true
        
    - name: Create linting summary
      if: always()  # Always run this step
      run: |
        echo "## 🔍 Code Quality Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "Security and linting scan completed. Issues are documented for review but won't block deployment." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**💡 Tip**: Run \`autopep8 --in-place --recursive .\` locally to auto-fix most formatting issues." >> $GITHUB_STEP_SUMMARY

  # Generate test report summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, dag-tests, dbt-tests, code-quality]
    if: always()
    
    steps:
    - name: Generate test summary
      run: |
        echo "## 📊 Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "| Test Suite | Status | Impact |" >> $GITHUB_STEP_SUMMARY
        echo "|------------|--------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Unit Tests | ${{ needs.unit-tests.result }} | 🚫 Blocks deployment |" >> $GITHUB_STEP_SUMMARY
        echo "| DAG Tests | ${{ needs.dag-tests.result }} | 🚫 Blocks deployment |" >> $GITHUB_STEP_SUMMARY
        echo "| dbt Tests | ${{ needs.dbt-tests.result }} | 🚫 Blocks deployment |" >> $GITHUB_STEP_SUMMARY
        echo "| Code Quality | ${{ needs.code-quality.result }} | ℹ️ Informational only |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Note**: Code quality issues are documented but won't prevent deployment. 🚀" >> $GITHUB_STEP_SUMMARY
